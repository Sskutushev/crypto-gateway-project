[package]
name = "gateway-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The registry is dependency-free so every crate can write to it. Only the
# two binaries serve it, and only they pull in the HTTP server.
server = ["dep:axum", "dep:http", "dep:thiserror", "dep:tokio", "dep:tracing"]

[dependencies]
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
