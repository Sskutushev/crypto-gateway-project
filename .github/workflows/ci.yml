name: ci

on:
  push:
    # Dependabot branches are covered by their pull requests; a push to one
    # would run everything twice.
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting, lints and the unit tests, on the pinned toolchain.
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-02
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The PostgreSQL scenarios, against a throwaway database. The roles scenario
  # applies every migration twice and the role SQL twice, so a migration that
  # is not idempotent or a grant that drifts from the code fails here.
  scenarios:
    name: PostgreSQL scenarios
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      GATEWAY_TEST_DATABASE_URL: "postgres://gateway:gateway@localhost:5432/gateway"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-02
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: migrations and roles apply twice
        run: "cargo test -p gateway-storage --locked -- --ignored roles::"
      - name: every scenario
        run: cargo test --workspace --locked -- --ignored

  # Seeded property tests with many more iterations than the unit run: the
  # money parser, the TRON address codec and the event-log decoder never panic
  # and keep their invariants. cargo-fuzz needs a nightly toolchain, which the
  # pinned stable toolchain rules out; these tests run on it.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-02
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked --release -- fuzz_smoke
        env:
          GATEWAY_FUZZ_ITERATIONS: "200000"

  # The TypeScript SDK on every Node version it supports, and the TypeScript
  # webhook receiver example, which needs Node 22's type stripping.
  typescript:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: build and test the SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build && npm test
      - name: webhook receiver example
        if: matrix.node == '22'
        working-directory: examples/webhook-receiver-typescript
        run: npm test

  # The chain simulator is a test double for integrators; its own tests pin
  # the address codec, the event-log encoding and the control API's access.
  simulator:
    name: chain simulator unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unittest
        working-directory: tools/chain-simulator
        run: python3 -m unittest -v

  # The unmodified gateway, end to end, on the simulated chain: an exact
  # payment settles, a wrong amount is queued as unmatched, a reverted
  # transaction pays nothing. It proves the wiring, not anything about TRON.
  simulator-e2e:
    name: end to end on the chain simulator
    runs-on: ubuntu-24.04
    needs: [simulator]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: gateway_e2e
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_e2e"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-02
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p gateway-api -p gateway-worker
      - name: e2e
        env:
          GATEWAY_DATABASE_URL: "postgres://gateway:gateway@localhost:5432/gateway_e2e"
          E2E_RESET_DATABASE: "yes"
          E2E_WORKDIR: ${{ runner.temp }}/simulator-e2e
        run: |
          mkdir -p "$E2E_WORKDIR"
          bash tools/chain-simulator/e2e.sh
      - name: logs
        if: failure()
        run: tail -n 50 "${{ runner.temp }}"/simulator-e2e/*.log

  # Dependency policy is release-blocking. A payment service must not publish
  # an image when its direct/runtime dependency graph has a known advisory or
  # when the advisory database cannot be checked.
  supply-chain:
    name: cargo deny, cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-02
        with:
          toolchain: 1.90.0
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: ignored advisories stay out of the build
        run: |
          for crate in rsa derivative; do
            if cargo tree --locked -i "$crate" --edges normal,build 2>/dev/null | grep -q .; then
              echo "::error::$crate is now compiled; its ignored advisory in .cargo/audit.toml must be revisited"
              exit 1
            fi
          done

  # The deployment files are valid before they are shipped with the image.
  deploy-manifests:
    name: compose and kustomize validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose config
        run: |
          for example in deploy/env/*.env.example; do cp "$example" "${example%.example}"; done
          docker compose -f deploy/compose.production.yaml config --quiet
          docker compose -f compose.yaml --profile workers --profile simulator config --quiet
      - name: kustomize build
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          kubectl kustomize deploy/overlays/production > /dev/null
          kubectl kustomize deploy/k8s/monitoring > /dev/null

  # The WooCommerce plugin: every PHP file parses on the oldest and a current
  # supported PHP, and the unit tests of its signature, money and order-state
  # code pass.
  woocommerce-plugin:
    name: WooCommerce plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: integrations/woocommerce/crypto-gateway-usdt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: php lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # One image for the API and the workers, with its SBOM and a scan that fails
  # on HIGH or CRITICAL findings. This job runs on every push and pull request
  # and holds no privilege at all: no registry write, no OIDC identity. The
  # third-party actions it runs cannot publish or sign anything.
  image:
    name: image, SBOM, scan
    runs-on: ubuntu-24.04
    needs: [check, scenarios]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: crypto-gateway-project:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: crypto-gateway-project:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crypto-gateway-project:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # An image whose version has no CHANGELOG section, or whose binaries
      # carry another version, is not published; release.yml would refuse
      # to describe it afterwards anyway.
      - name: release notes and version agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null

  # Published to ghcr.io only from a version tag, by a job that exists only
  # then: the registry token and the OIDC identity for keyless signing are
  # never present in a pull-request run. The image is built again here from
  # the same commit (the build cache is read, never written), and the SBOM and
  # the scan are taken from the published digest itself, so what the release
  # describes is exactly what was pushed.
  publish:
    name: publish and sign
    runs-on: ubuntu-24.04
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/crypto-gateway-project
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: false
      - name: SBOM of the published digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/crypto-gateway-project@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: scan of the published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/crypto-gateway-project@${{ steps.publish.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # Signed by digest: a tag can be moved, the digest is the image. The SBOM
      # is attached to the same digest as an attestation, so a verifier gets
      # it from the registry rather than from a workflow artifact.
      - name: sign and attest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crypto-gateway-project@${DIGEST}"
          cosign sign --yes "$image"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$image"
          echo "signed $image" >> "$GITHUB_STEP_SUMMARY"
