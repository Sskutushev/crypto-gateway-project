name: Bug report
description: Something the gateway did that it should not have, or refused that it should not have refused.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem (money counted wrong, a fact made from too little evidence, a forgeable signature) goes through private vulnerability reporting instead; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request or the worker action, the response or log line, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. A failing test is the best report.
      placeholder: |
        1. seed …
        2. POST /v1/… with …
        3. observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag, or the commit, and the image tag if deployed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - merchant API (intents, quotes, idempotency)
        - operator API (prices, rail health, rail stops, reads)
        - chain intake or verification
        - matching and settlement
        - webhooks and outbox
        - reconciliation or health
        - self-check, roles, deployment
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with keys and addresses redacted.
      render: text
