version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    ignore:
      # The types pin the oldest supported Node, so newer APIs fail to compile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 removed `moduleResolution: node10`, the only resolution
      # that builds the CommonJS half of the package from ESM sources. Moving
      # to 7 means dropping `require()` support, a decision for a release.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
