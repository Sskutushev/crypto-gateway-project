[workspace]
members = [
  "apps/gateway-api",
  "apps/gateway-worker",
  "crates/gateway-application",
  "crates/gateway-domain",
  "crates/gateway-http",
  "crates/gateway-scheduler",
  "crates/gateway-storage",
  "crates/gateway-tron",
  "crates/gateway-webhook",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/Sskutushev/crypto-gateway-project"

[workspace.dependencies]
alloy-primitives = { version = "1.3", features = ["serde"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
bs58 = "0.5"
gateway-application = { version = "0.1.0", path = "crates/gateway-application" }
hmac = "0.12"
gateway-domain = { version = "0.1.0", path = "crates/gateway-domain" }
gateway-http = { version = "0.1.0", path = "crates/gateway-http" }
gateway-scheduler = { version = "0.1.0", path = "crates/gateway-scheduler" }
gateway-storage = { version = "0.1.0", path = "crates/gateway-storage" }
gateway-tron = { version = "0.1.0", path = "crates/gateway-tron" }
gateway-webhook = { version = "0.1.0", path = "crates/gateway-webhook" }
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = [
  "charset",
  "http2",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
  "time",
  "uuid",
] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.47", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
