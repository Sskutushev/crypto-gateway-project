[advisories]
yanked = "deny"
# Each ignore names why the advisory does not reach the shipped binaries. The
# CI job "ignored advisories stay out of the build" fails the moment a crate
# ignored as not compiled starts being compiled.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable: a compile-time proc-macro pulled in by alloy-primitives, with no maintained replacement upstream yet" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[graph]
# The shipped binaries are built for Linux only (see the Dockerfile); the
# Windows and Redox shims that some crates carry for other targets are not
# compiled into them and are not part of the audit surface.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[bans]
# A second copy of a crate is a second copy of its bugs and its audit surface.
# Duplicates that the ecosystem has not converged on yet are named here with
# the reason, so each one is a decision rather than a shrug. Each entry names
# the older copy and who still asks for it; it is removed when that upstream
# moves. Direct dependencies were converged instead: tower-http follows the
# 0.6 line reqwest 0.12 pins, and the test-only k256 follows alloy-primitives.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # alloy-primitives hashes with sha3 0.11 (digest 0.11) while its own k256
    # 0.13 still sits on digest 0.10; the RustCrypto 0.11 line converges when
    # k256 0.14 lands in alloy. Both copies are pure Rust and audited together.
    { crate = "digest@0.10", reason = "k256 0.13 (via alloy-primitives) is still on the digest 0.10 line" },
    { crate = "block-buffer@0.10", reason = "digest 0.10, see above" },
    { crate = "crypto-common@0.1", reason = "digest 0.10, see above" },
    { crate = "cpufeatures@0.2", reason = "sha2 0.10 and const-hex, see above" },
    # sqlx 0.8 pins hashlink 0.10 (hashbrown 0.15) while indexmap and alloy
    # are on hashbrown 0.17; converges with the next sqlx hashlink bump.
    { crate = "hashbrown@0.15", reason = "sqlx-core's hashlink 0.10 pins it" },
    { crate = "foldhash@0.1", reason = "hashbrown 0.15, see above" },
    # sqlx-core bundles webpki-roots 0.26 for its own TLS; reqwest's
    # hyper-rustls is on 1.0. Both are the same Mozilla root store.
    { crate = "webpki-roots@0.26", reason = "sqlx-core 0.8 pins it" },
    # rand 0.8 (sqlx-postgres) and ring are on getrandom 0.2; uuid is on 0.4.
    { crate = "getrandom@0.2", reason = "rand_core 0.6 via sqlx-postgres, and ring 0.17" },
    # Proc-macro parsers only: compiled on the build host, never shipped.
    { crate = "syn@2", reason = "derive_more, sqlx-macros and tracing-attributes still parse with syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
