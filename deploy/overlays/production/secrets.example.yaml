# The Secrets the production overlay adds to the base set, by name and key,
# with no values. Create them from a secret manager (External Secrets, Sealed
# Secrets, a CSI secret store) rather than from a shell: a Secret typed by
# hand is a credential that has been on a workstation.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db-observer-b
type: Opaque
stringData:
  # The login role named as the second source's chain_sources.db_principal.
  GATEWAY_DATABASE_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-tron-observer-b
type: Opaque
stringData:
  # The second provider's own credential — a different company, not a second
  # key from the first.
  GATEWAY_TRON_API_KEY: ""
