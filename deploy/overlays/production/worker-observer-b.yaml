# The second observer: a different provider group than the base observer, or
# it adds nothing to the verification policy. Its source key, base URL and
# API key header come from its own ConfigMap entries below; its API key and
# its database login (the source's db_principal) from its own Secrets, named
# in secrets.example.yaml of this overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config-observer-b
data:
  GATEWAY_OBSERVER_SOURCE_KEY: provider-two-mainnet
  GATEWAY_TRON_BASE_URL: https://tron-mainnet.provider-two.example
  GATEWAY_TRON_API_KEY_HEADER: TRON-PRO-API-KEY
  GATEWAY_TRON_LANE: block_range
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker-observer-b
  labels:
    app.kubernetes.io/name: gateway-worker-observer-b
    app.kubernetes.io/component: worker
    gateway.role: observer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-worker-observer-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-worker-observer-b
        app.kubernetes.io/component: worker
        gateway.role: observer
    spec:
      automountServiceAccountToken: false
      priorityClassName: gateway-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway-worker-observer-b
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-worker-observer-b
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sskutushev/crypto-gateway-project:0.1.0
          command: ["/usr/local/bin/gateway-worker"]
          env:
            - name: GATEWAY_WORKER_ROLES
              value: observer
            - name: GATEWAY_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GATEWAY_OBSERVER_INTERVAL_SECONDS
              value: "5"
            - name: GATEWAY_TRON_MAX_BLOCKS_PER_SCAN
              value: "50"
          envFrom:
            # Shared values first, then this source's own, which win.
            - configMapRef:
                name: gateway-config
            - configMapRef:
                name: gateway-config-observer-b
            - secretRef:
                name: gateway-db-observer-b
            - secretRef:
                name: gateway-tron-observer-b
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
