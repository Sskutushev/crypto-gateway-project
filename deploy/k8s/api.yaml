apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-api
          image: ghcr.io/sskutushev/crypto-gateway-project:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_BIND_ADDRESS
              value: 0.0.0.0:8080
            # Migrations are a release step under the migrator role, and the
            # expiry sweep is a worker; the API role has neither privilege.
            - name: GATEWAY_RUN_MIGRATIONS
              value: "false"
            - name: GATEWAY_EXPIRY_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-db-api
          # Readiness is the start-up self-check re-evaluated: a pod whose
          # database stops describing its configuration leaves the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  labels:
    app.kubernetes.io/name: gateway-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# One API pod is always serving during a rollout or a node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api
