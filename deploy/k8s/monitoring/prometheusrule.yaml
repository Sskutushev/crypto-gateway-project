# What pages. Every rule names a series the gateway already serves and the
# runbook that says what to do; thresholds are starting points for a
# deployment to tune against its own volume.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway-api
spec:
  groups:
    - name: gateway.availability
      rules:
        - alert: GatewayMetricsAbsent
          expr: absent(gateway_payment_intents) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The gateway is not being scraped"
            description: "No gateway_payment_intents series for 5 minutes: the API is down, the scrape token was revoked, or the network policy changed."
            runbook: docs/operator-runbook.md
        - alert: GatewayScrapeFailing
          expr: up{job=~".*gateway-api.*"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "The gateway API answers no scrape"

    - name: gateway.components
      rules:
        - alert: GatewayComponentNotHealthy
          expr: gateway_component_state{state!="healthy"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Component {{ $labels.component }} is {{ $labels.state }}"
            description: "A worker has reported itself degraded or stopped for 10 minutes; its lease holder may be gone."
            runbook: docs/operator-runbook.md
        - alert: GatewayRailStopped
          expr: gateway_rail_stops_open > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "A rail is stopped: no new quotes, settlement held"
            description: "Reconciliation or an operator stopped a rail. Settlement waits until a person reopens it."
            runbook: docs/operator-runbook.md

    - name: gateway.pipeline
      rules:
        - alert: GatewayObservationConflicts
          expr: gateway_observation_conflicts_open > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Independent sources disagree about a transfer"
            description: "{{ $value }} open observation conflicts. Nothing settles on a disputed fact; a person decides which source lied."
            runbook: docs/operator-runbook.md
        - alert: GatewayOutboxDeadLetters
          expr: gateway_outbox_events_dead_lettered > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Webhook events were dead-lettered in the last hour"
            description: "A merchant endpoint refused or failed every attempt. The events wait for redelivery; the merchant's fulfilment is late until then."
            runbook: docs/operator-runbook.md
        - alert: GatewayOutboxBacklog
          expr: gateway_outbox_events_pending > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} webhook events pending for 15 minutes"
            description: "The outbox worker is behind or down; merchants learn about their payments late."
        - alert: GatewayReconciliationStale
          expr: time() - gateway_reconciliation_last_run_timestamp_seconds > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No reconciliation run for 30 minutes"
            runbook: docs/operator-runbook.md
        - alert: GatewayReconciliationDiscrepancies
          expr: gateway_reconciliation_open_discrepancies > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} open reconciliation discrepancies"
            description: "The chain and the ledger disagree somewhere. Each discrepancy is a row an operator closes with a reason."
            runbook: docs/operator-runbook.md
        - alert: GatewayExpiryStale
          expr: time() - gateway_expiry_last_success_timestamp_seconds > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No successful expiry sweep for 15 minutes"
            description: "Quotes past their deadline are not being closed; exact-amount leases are not being released."

    - name: gateway.capacity
      rules:
        - alert: GatewayCollectorNearlyFull
          expr: gateway_collector_open_leases / 10000 > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Address {{ $labels.collector_id }} holds {{ $value | humanizePercentage }} of its exact-amount slots"
            description: "Quotes spill to the next collector at the limit and fail when none is left; add a collector address before that."
            runbook: docs/operator-runbook.md
