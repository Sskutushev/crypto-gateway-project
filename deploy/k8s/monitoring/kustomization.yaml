# Prometheus Operator objects for the gateway: how the API's `/metrics` and
# every pod's process metrics are scraped, and which series page somebody. Applied beside the base, into the
# gateway's namespace, by a cluster that runs the Prometheus Operator; a
# cluster without it skips this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crypto-gateway

resources:
  - servicemonitor.yaml
  - podmonitor.yaml
  - prometheusrule.yaml
