# The Secrets the deployments reference, by name and key, with no values.
#
# Not part of the kustomization: create them from a secret manager (or
# `kubectl create secret generic` from files) before the first apply. One
# database secret per role, so a leaked pod credential names the process it
# came from and carries that process's privileges only.
#
# Every GATEWAY_DATABASE_URL must use sslmode=verify-full; the database is
# reached only over TLS.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db-api
type: Opaque
stringData:
  GATEWAY_DATABASE_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db-payment
type: Opaque
stringData:
  GATEWAY_DATABASE_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db-observer
type: Opaque
stringData:
  # The observer's login role is the chain source's db_principal.
  GATEWAY_DATABASE_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db-verifier
type: Opaque
stringData:
  GATEWAY_DATABASE_URL: ""
---
apiVersion: v1
