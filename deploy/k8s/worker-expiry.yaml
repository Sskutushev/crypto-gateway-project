apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker-expiry
  labels:
    app.kubernetes.io/name: gateway-worker-expiry
    app.kubernetes.io/component: worker
    gateway.role: expiry
spec:
  # Leases fence a second copy, but one copy is the intent: Recreate means a
  # rollout stops the old process before the new one takes the lease.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-worker-expiry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-worker-expiry
        app.kubernetes.io/component: worker
        gateway.role: expiry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sskutushev/crypto-gateway-project:0.1.0
          command: ["/usr/local/bin/gateway-worker"]
          env:
            - name: GATEWAY_WORKER_ROLES
              value: expiry
            - name: GATEWAY_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GATEWAY_EXPIRY_INTERVAL_SECONDS
              value: "30"
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-db-payment
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
