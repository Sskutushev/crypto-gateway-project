apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker-verifier
  labels:
    app.kubernetes.io/name: gateway-worker-verifier
    app.kubernetes.io/component: worker
    gateway.role: verifier
spec:
  # Two replicas, one leader: the component lease in PostgreSQL decides which
  # replica works and fences the other out of writes, so a node drain or a
  # rollout moves the work instead of stopping it. The non-leader idles and
  # reports itself as such.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-worker-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-worker-verifier
        app.kubernetes.io/component: worker
        gateway.role: verifier
    spec:
      automountServiceAccountToken: false
      priorityClassName: gateway-critical
      # The two replicas never share a node, and spread across zones where
      # the cluster has them; a single-node cluster still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway-worker-verifier
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-worker-verifier
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sskutushev/crypto-gateway-project:0.1.0
          command: ["/usr/local/bin/gateway-worker"]
          env:
            - name: GATEWAY_WORKER_ROLES
              value: verifier
            - name: GATEWAY_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GATEWAY_VERIFIER_INTERVAL_SECONDS
              value: "5"
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-db-verifier
            - secretRef:
                name: gateway-tron-verifier
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
