apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker-outbox
  labels:
    app.kubernetes.io/name: gateway-worker-outbox
    app.kubernetes.io/component: worker
    gateway.role: outbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-worker-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-worker-outbox
        app.kubernetes.io/component: worker
        gateway.role: outbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sskutushev/crypto-gateway-project:0.1.0
          command: ["/usr/local/bin/gateway-worker"]
          env:
            - name: GATEWAY_WORKER_ROLES
              value: outbox
            - name: GATEWAY_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GATEWAY_OUTBOX_INTERVAL_SECONDS
              value: "2"
            - name: GATEWAY_WEBHOOK_MAX_ATTEMPTS
              value: "12"
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-db-payment
            - secretRef:
                name: gateway-webhook
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
